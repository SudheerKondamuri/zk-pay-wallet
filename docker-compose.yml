version: '3.8'

services:
  hardhat:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "npm install && npx hardhat node"
    ports:
      - "8545:8545"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8545", "--post-data", "{\"jsonrpc\":\"2.0\",\"method\":\"eth_chainId\",\"params\":[],\"id\":1}", "--header", "Content-Type: application/json"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rollup_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  deployer:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      hardhat:
        condition: service_healthy
    command: >
      sh -c "npm install && npx hardhat run scripts/deploy.js --network localhost"

  backend:
    build:
      context: ./backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rollup_db
      POSTGRES_PORT: 5432
      RPC_URL: http://hardhat:8545
    ports:
      - "4000:4000"
    volumes:
      - ./deployments:/app/deployments
    depends_on:
      postgres:
        condition: service_healthy
      deployer:
        condition: service_completed_successfully
    command: npm start

  indexer:
    build:
      context: ./backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rollup_db
      POSTGRES_PORT: 5432
      RPC_URL: http://hardhat:8545
    volumes:
      - ./deployments:/app/deployments
    depends_on:
      postgres:
        condition: service_healthy
      deployer:
        condition: service_completed_successfully
    command: npm run start:indexer

  relayer:
    build:
      context: ./backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rollup_db
      POSTGRES_PORT: 5432
      RPC_URL: http://hardhat:8545
      RELAYER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
    volumes:
      - ./deployments:/app/deployments
    depends_on:
      postgres:
        condition: service_healthy
      deployer:
        condition: service_completed_successfully
    command: npm run start:relayer

  flutter:
    build:
      context: ./flutter_app
    ports:
      - "8080:80"
    depends_on:
      - backend
