name: flutter_app
description: "ZK Vault — self-custody ZK rollup wallet"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  # Routing
  go_router: ^14.8.1
  # Networking
  http: ^1.6.0
  # Blockchain / Web3
  web3dart: ^2.7.3
  bip39: ^1.0.6
  bip32: ^2.0.0
  hex: ^0.2.0
  # Secure storage
  flutter_secure_storage: ^9.2.4
  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.5
  # Biometrics
  local_auth: ^2.3.0
  # Loading states
  shimmer: ^3.0.0
  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
